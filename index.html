<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPSO Reasoning Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Practice for EPSO verbal, numerical and abstract reasoning tests, with a visual guide to abstract reasoning rules.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0 } [hidden] { display: none !important } img { max-width: 100% }
/* Layout: a test-booklet column — sticky tab bar, one card per question, frames always on white "paper". */
:root {
  --bg: #ECEFF4; --surface: #FFFFFF; --ink: #172036; --muted: #586279; --rule: #D2D8E2;
  --accent: #2B46C4; --accent-ink: #FFFFFF; --accent-soft: #E3E8FB;
  --hl: #FFD43B; --good: #1D7F55; --good-soft: #DDF2E7; --bad: #B83A33; --bad-soft: #F8E1DF; --grid: #8E9AB2;
  --f-paper: #FFFFFF; --f-ink: #141A2C; --f-grey: #A2AABB; --f-guide: #C3CAD8; --f-blue: #2B5BD7; --f-red: #D33A2C;
  --it-g: #009246; --it-w: #F4F5F0; --it-r: #CE2B37;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-ui: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-read: "Source Serif 4", Georgia, serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1320; --surface: #171F31; --ink: #E3E7F0; --muted: #97A1B7; --rule: #2B3651;
  --accent: #8197FF; --accent-ink: #0E1320; --accent-soft: #232E52;
  --good: #52C892; --good-soft: #17352A; --bad: #F2776E; --bad-soft: #3D1F22; --grid: #8E9AB2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1320; --surface: #171F31; --ink: #E3E7F0; --muted: #97A1B7; --rule: #2B3651;
  --accent: #8197FF; --accent-ink: #0E1320; --accent-soft: #232E52;
  --good: #52C892; --good-soft: #17352A; --bad: #F2776E; --bad-soft: #3D1F22; --grid: #8E9AB2; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: var(--accent) }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0 }
h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); letter-spacing: -0.01em }
h2 { font-size: 1.9rem; margin-top: 2.6rem }
h3 { font-size: 1.35rem; margin-top: 1.6rem }
h4 { font-size: 1.15rem; font-weight: 600 }
p { margin: 0 }
.wrap { max-width: 1060px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule) }
header .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none }
.brand i { display: inline-grid; grid-template-columns: repeat(2, 7px); gap: 2px }
.brand i b { width: 7px; height: 7px; background: var(--ink) } .brand i b:nth-child(2) { background: var(--hl) } .brand i b:nth-child(3) { background: transparent; border: 1.5px solid var(--ink) }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto }
.tabs a { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px }
@media (max-width: 640px) { header .wrap { gap: 4px 12px } .tabs { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none } .tabs a { font-size: .95rem; padding: 4px 8px; white-space: nowrap } }
.tabs a:hover { color: var(--ink) } .tabs a.on { color: var(--accent-ink); background: var(--accent) }
main { padding-block: 28px 64px }
.lede { font-family: var(--font-read); font-size: 1.08rem; color: var(--muted); max-width: 66ch; margin-top: .5rem }
.muted { color: var(--muted) } .small { font-size: .9rem }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .14em; font-weight: 600; color: var(--accent); font-size: .95rem; margin-bottom: .4rem }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

/* format table */
.fmt { margin-top: 1.8rem; display: grid; gap: 0; border-top: 2px solid var(--ink) }
.fmt-row { display: grid; grid-template-columns: 9rem 7rem 4.5rem 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums }
.fk { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; text-transform: uppercase; letter-spacing: .04em }
.fp { color: var(--muted) }
.fmt p { margin-top: 10px }
@media (max-width: 640px) { .fmt-row { grid-template-columns: 1fr auto; } .fmt-row .fp { grid-column: 1 / -1 } .fmt-row span:nth-child(2), .fmt-row span:nth-child(3) { font-size: .95rem } }

/* method */
.method { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 1rem }
.mstep { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; display: grid; gap: 6px; align-content: start }
.mstep b { font-family: var(--font-display); font-size: 1.3rem; text-transform: uppercase; letter-spacing: .05em }
.mstep p { color: var(--muted); font-size: .95rem }
.mn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--hl); color: #141A2C; font-weight: 700; font-family: var(--font-mono); font-size: .9rem }
@media (max-width: 760px) { .method { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

/* frames */
.frame { display: block; line-height: 0 } .frame svg { width: 100%; height: auto; display: block }
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: 12px; max-width: 760px }
.fr { margin: 0; display: grid; gap: 4px; justify-items: center } .fr .frame { width: 100% }
.fr figcaption { font-family: var(--font-mono); font-size: .78rem; color: var(--muted) }
.fr.next figcaption { color: var(--accent); font-weight: 700 }
.aopts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 20px; max-width: 760px }
.aopt { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 6px; padding: 8px; border-radius: 8px; border: 2px solid transparent; background: var(--bg); position: relative; transition: border-color .15s, opacity .2s }
.aopt:hover { border-color: var(--rule) } .aopt:focus-visible { outline: 3px solid var(--accent) }
.aopt .ol, .topt .ol { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem }
.aopt.chosen { border-color: var(--accent); background: var(--accent-soft) }
.aopt.right { border-color: var(--good); background: var(--good-soft) } .aopt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.aopt.struck { opacity: .35 }
.aopt.struck::after { content: ""; position: absolute; inset: 22px 10px 8px; background: linear-gradient(to top right, transparent calc(50% - 2px), var(--bad) calc(50% - 2px), var(--bad) calc(50% + 2px), transparent calc(50% + 2px)) }
.aopt[disabled] { cursor: default }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)) } .aopts { grid-template-columns: repeat(3, minmax(0, 1fr)) } }

/* rule-step explainer */
.explain { margin-top: 22px; border-top: 1px dashed var(--rule); padding-top: 16px; display: grid; gap: 10px }
.explain p { font-family: var(--font-read); max-width: 70ch }
.hint { color: var(--muted); font-size: .95rem }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px }
.step { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 4.6rem 1fr; gap: 4px 12px; padding: 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface) }
.step:hover { border-color: var(--accent) } .step:focus-visible { outline: 3px solid var(--accent) }
.step.on { border-color: #C9A21A; background: color-mix(in srgb, var(--hl) 22%, var(--surface)) }
.sn { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; grid-row: span 2 }
.st { font-family: var(--font-read) } .se { font-size: .88rem; color: var(--bad); font-weight: 600 }
.finale { font-weight: 600 }

/* cards & practice */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: clamp(14px, 3vw, 26px); margin-top: 16px; min-width: 0 }
.phead { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap }
.phead h2 { margin-top: 0 }
.score { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: .95rem }
.score b { font-size: 1.6rem; color: var(--accent) }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px }
.chip { all: unset; box-sizing: border-box; cursor: pointer; min-width: 34px; height: 34px; padding: 0 6px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); font-family: var(--font-mono); font-size: .85rem }
.chip:hover { border-color: var(--accent) } .chip:focus-visible { outline: 3px solid var(--accent) }
.chip.cur { border: 2px solid var(--accent) }
.chip.ok { background: var(--good-soft); border-color: var(--good) } .chip.no { background: var(--bad-soft); border-color: var(--bad) }
.chip.answered { background: var(--accent-soft) } .chip.flag { box-shadow: inset 0 -4px 0 var(--hl) }
.qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.qhead.lone { margin-bottom: 12px }
.tag.lvl-Hard { background: var(--bad); color: var(--surface) }
.filter { display: inline-flex; margin-top: 18px; border: 1px solid var(--rule); border-radius: 8px; padding: 3px; background: var(--surface); gap: 3px }
.seg { all: unset; box-sizing: border-box; cursor: pointer; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: .92rem; color: var(--muted) }
.seg:hover { color: var(--ink) } .seg:focus-visible { outline: 3px solid var(--accent) }
.seg.on { background: var(--accent); color: var(--accent-ink) }
.chip { position: relative }
.chip .hd { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--bad) }
.chips { margin-top: 12px }
.tag { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: .85rem; padding: 2px 8px; border-radius: 4px; background: var(--ink); color: var(--bg) }
.fam { font-size: .85rem; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 7px }
.gridtog { margin-left: auto; font-size: .9rem; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer }
.stem { font-weight: 600; font-size: 1.08rem; margin-top: 16px; max-width: 70ch }
.passage { background: var(--bg); border-radius: 8px; padding: 16px 18px } .passage p { font-family: var(--font-read); font-size: 1.05rem; line-height: 1.65; max-width: 70ch; margin-top: 6px }
.topts { display: grid; gap: 8px; margin-top: 14px }
.topt { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1.8rem 1fr; gap: 8px; padding: 10px 14px; border-radius: 8px; border: 2px solid var(--rule); background: var(--surface) }
.topt:hover { border-color: var(--accent) } .topt:focus-visible { outline: 3px solid var(--accent) }
.topt.chosen { border-color: var(--accent); background: var(--accent-soft) }
.topt.right { border-color: var(--good); background: var(--good-soft) } .topt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.topt[disabled] { cursor: default }
.ot { min-width: 0 } .vv { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: .92rem }
.verdict { font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 4px }
.v-T { background: var(--good); color: var(--surface) } .v-F { background: var(--bad); color: var(--surface) } .v-C { background: var(--muted); color: var(--surface) }
.why { color: var(--muted); font-family: var(--font-read) }
.data h4 { margin-bottom: 8px }
.tw { overflow-x: auto }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 100%; font-size: .95rem }
th, td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap }
th:first-child, td:first-child { text-align: left }
th { font-family: var(--font-display); font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: .03em; border-bottom: 2px solid var(--ink); white-space: normal; vertical-align: bottom }
tr.tot td { font-weight: 700; border-top: 2px solid var(--ink) }
.note { font-size: .85rem; color: var(--muted); margin-top: 6px }
svg.bar { width: 100%; max-width: 520px; height: auto } .ax { fill: var(--muted); font: 11px var(--font-mono) } .bv { fill: var(--ink); font: 600 11px var(--font-mono) }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px }
.btn { font: 600 1rem var(--font-ui); padding: 9px 18px; border-radius: 6px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer }
.btn.ghost { background: transparent; color: var(--accent) }
.btn:disabled { opacity: .4; cursor: default }
.link { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px } .link:focus-visible { outline: 3px solid var(--accent) }
.result { margin-top: 12px; font-weight: 700; font-size: 1.1rem } .result.good { color: var(--good) } .result.bad { color: var(--bad) }
.reset { margin-top: 26px; font-size: .9rem }

/* exam */
.exambar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--font-display); font-size: 1.2rem; font-weight: 600 }
.clock { font-family: var(--font-mono); font-size: 1.5rem; padding: 2px 12px; border-radius: 6px; background: var(--ink); color: var(--bg); font-variant-numeric: tabular-nums }
.clock.low { background: var(--bad) }
.pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 20px }
.pickcard { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 2px solid var(--rule); border-radius: 10px; padding: 18px; display: grid; gap: 6px }
.pickcard:hover, .pickcard:focus-visible { border-color: var(--accent) }
.pk { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700 } .pm { font-family: var(--font-mono); font-size: .9rem } .pp { color: var(--muted); font-size: .9rem }
@media (max-width: 700px) { .pick { grid-template-columns: 1fr } }
.confirm { margin-top: 14px; padding: 14px; border-radius: 8px; background: var(--accent-soft) } .confirm p { margin-bottom: 10px }
.review { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 6px }
.rv { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 7rem 1fr auto; gap: 10px; padding: 9px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--rule); font-variant-numeric: tabular-nums }
.rv:hover, .rv:focus-visible { border-color: var(--accent) }
.review .ok .rvs { color: var(--good); font-weight: 700 } .review .no .rvs { color: var(--bad); font-weight: 700 }

/* guide */
.hero { padding-block: 12px 4px }
.walk { max-width: 820px }
.fams { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; margin-top: 16px }
.fam-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.fam-card p { font-size: .95rem; font-family: var(--font-read) }
.fam-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
.flip { width: 84px; flex: none; position: relative } .fnum { position: absolute; right: 4px; bottom: 2px; font: 600 11px var(--font-mono); color: var(--f-ink) }
.ministrip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px }
.trap { color: var(--muted) }
.time { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 14px; border-top: 2px solid var(--ink) }
.time > div { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--rule) }
.tt { font-family: var(--font-mono); font-weight: 500; color: var(--accent) }
@media (max-width: 640px) { .time { grid-template-columns: 1fr } }
.tips { padding-left: 1.2rem; display: grid; gap: 6px; margin-top: 14px; max-width: 75ch }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 12px } .two h4 { margin-top: 8px }
@media (max-width: 700px) { .two { grid-template-columns: 1fr } }
.sources { margin-top: 32px; max-width: 80ch }
/* Italian tab and sub-navigation */
.tabs a.tab-it { display: inline-flex; align-items: center; gap: 7px; text-transform: none; letter-spacing: .01em }
.tric { display: inline-grid; grid-template-columns: repeat(3, 5px); height: 12px; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; flex: none }
.tric b:nth-child(1) { background: var(--it-g) } .tric b:nth-child(2) { background: var(--it-w) } .tric b:nth-child(3) { background: var(--it-r) }
.subwrap { padding-block: 0 }
.subtabs { display: flex; gap: 4px; flex-wrap: wrap; padding-block: 0 8px; border-top: 1px dashed var(--rule); padding-top: 8px }
.subtabs a { font-family: var(--font-display); font-weight: 600; font-size: 1rem; text-decoration: none; color: var(--muted); padding: 4px 10px; border-radius: 6px; border-bottom: 3px solid transparent }
.subtabs a:hover { color: var(--ink) } .subtabs a.on { color: var(--ink); border-bottom-color: var(--it-g); background: var(--bg) }
@media (max-width: 640px) { .subtabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none } .subtabs a { white-space: nowrap } }

/* Italian-style abstract page */
.notebox { margin-top: 16px; padding: 14px 16px; border-radius: 8px; background: var(--accent-soft); max-width: 75ch; font-family: var(--font-read) }
.its .filter { margin-top: 22px }
.eqs { display: grid; gap: 10px; margin-top: 14px }
.eq { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-width: 0 }
.eq .frame { width: clamp(52px, 15vw, 104px); flex: none }
.eq.small .frame { width: clamp(52px, 13vw, 88px) }
.eq.ask { padding-top: 10px; border-top: 1px dashed var(--rule) }
.eq .op { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; color: var(--muted); min-width: 1ch; text-align: center }
.mat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; max-width: 330px; margin-top: 14px }
.itg { max-width: 820px; display: grid; gap: 12px }
.results { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.results.five { grid-template-columns: repeat(5, minmax(0, 1fr)) }
.results figure { margin: 0; display: grid; gap: 6px; align-content: start }
.results figcaption { font-size: .88rem; color: var(--muted); display: grid; gap: 2px } .results figcaption b { color: var(--ink) }
@media (max-width: 560px) { .results { grid-template-columns: repeat(2, minmax(0, 1fr)) } .results.five { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem; color: var(--muted) }
.key span { display: inline-flex; align-items: center; gap: 6px }
.key i { width: 22px; height: 0; border-top: 4px solid var(--f-ink) }
.key i.k-b { border-top-color: var(--f-blue) } .key i.k-c { border-top: 4px dashed var(--f-red) }
.its ol.tips { list-style: decimal }

/* pop-up calculator */
.calc-fab { position: fixed; z-index: 20; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 56px; height: 56px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 18px rgba(12, 18, 36, .28) }
.calc-fab svg { width: 28px; height: 28px }
.calc-fab.on { background: var(--ink); color: var(--bg) }
.calc-fab:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px }
